<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollbook 시작 중…</title>
<style>
:root { --primary:#4F46E5; --bg:#F9FAFB; --text:#111827; --muted:#6B7280; --line:#E5E7EB; }
* { box-sizing:border-box; }
body { margin:0; background:var(--bg); color:var(--text); font-family:'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif; display:flex; align-items:center; justify-content:center; min-height:100vh; }
.card { background:#fff; border:1px solid var(--line); border-radius:24px; box-shadow:0 10px 30px rgba(0,0,0,.04); padding:40px 48px; text-align:center; max-width:420px; margin:20px; }
.spin { width:44px; height:44px; border-radius:999px; border:4px solid #EEF2FF; border-top-color:var(--primary); margin:0 auto 18px; animation:r 1s linear infinite; }
@keyframes r { to { transform:rotate(360deg); } }
h1 { font-size:20px; font-weight:800; letter-spacing:-.02em; margin:0 0 8px; }
p { margin:4px 0; font-size:14px; color:var(--muted); line-height:1.6; }
.hint { display:none; margin-top:16px; background:#FFFBEB; border:1px solid #FDE68A; color:#92400E; border-radius:12px; padding:11px 14px; font-size:12.5px; text-align:left; }
.hint.show { display:block; }
</style>
</head>
<body>
<div class="card">
  <div class="spin"></div>
  <h1>Rollbook 시작 중…</h1>
  <p>서버가 켜지면 자동으로 이동합니다.</p>
  <p style="font-size:12.5px;">(<span id="n">0</span>초 경과)</p>
  <div class="hint" id="hint">
    1분 넘게 이 화면이면 검은 콘솔 창을 확인해 주세요.<br>
    · <b>Ready on http://localhost:8787</b> 이 보이면 → <a href="http://localhost:8787">여기를 클릭</a><br>
    · 빨간 오류가 보이면 → 그 내용을 캡처해서 알려주세요
  </div>
</div>
<script>
const SITE = 'http://localhost:8787';
let sec = 0;
const timer = setInterval(async () => {
  sec++;
  document.getElementById('n').textContent = sec;
  if (sec > 45) document.getElementById('hint').classList.add('show');
  if (sec > 600) { clearInterval(timer); return; }
  try {
    await fetch(SITE + '/api/status', { mode: 'no-cors', cache: 'no-store' });
    clearInterval(timer);
    location.href = SITE;
  } catch (e) { /* 아직 준비 안 됨 */ }
}, 1000);
</script>
</body>
</html>
