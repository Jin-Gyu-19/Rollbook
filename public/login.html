<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollbook 로그인</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234F46E5%22/><path d=%22M25 25h20v20H25zM55 25h20v20H55zM25 55h20v20H25zM55 55h8v8h-8zM67 55h8v8h-8zM55 67h8v8h-8zM67 67h8v8h-8z%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="/bdo-design.css">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .login-card { width: min(400px, calc(100vw - 40px)); padding: 38px 34px 32px; text-align: center; }
  .login-logo { height: 34px; margin-bottom: 14px; }
  .login-title { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .login-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .login-card input { width: 100%; text-align: center; font-size: 17px; letter-spacing: .06em; margin-bottom: 12px; }
  .login-card button.primary { width: 100%; padding: 12px; font-size: 16px; }
  .login-err { color: var(--danger); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }
  .login-hint { color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.6; }
  .login-or { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 12.5px; margin: 18px 0 12px; }
  .login-or::before, .login-or::after { content: ''; flex: 1; height: 1px; background: var(--line); }
  .qr-login-btn { width: 100%; padding: 11px; font-size: 15px; }
  .qr-cam { position: relative; width: 100%; aspect-ratio: 1; border-radius: 16px; overflow: hidden; background: #111827; margin-bottom: 12px; }
  .qr-cam video { width: 100%; height: 100%; object-fit: cover; }
  .qr-cam .qr-guide { position: absolute; inset: 14%; border: 2px solid rgba(255,255,255,.85); border-radius: 14px; box-shadow: 0 0 0 999px rgba(0,0,0,.25); pointer-events: none; }
  .qr-cam .qr-state { position: absolute; left: 0; right: 0; bottom: 10px; text-align: center; color: #fff; font-size: 13px; text-shadow: 0 1px 4px rgba(0,0,0,.6); }
</style>
</head>
<body>

<div class="card login-card">
  <img src="/api/logo" class="login-logo" alt="BDO">
  <h1 class="login-title">Rollbook</h1>
  <p class="login-sub" id="subText">비밀번호를 입력해 주세요</p>

  <!-- 로그인 -->
  <form id="loginForm" class="hidden">
    <input type="password" id="pw" placeholder="비밀번호 또는 스캐너 접속 코드" autocomplete="current-password">
    <button class="primary" type="submit">로그인</button>
    <div class="login-or">또는</div>
    <div class="qr-cam hidden" id="qrCam">
      <video id="qrVideo" autoplay muted playsinline></video>
      <div class="qr-guide"></div>
      <div class="qr-state" id="qrState">관리자 로그인 QR 을 비춰 주세요</div>
    </div>
    <button type="button" class="qr-login-btn" id="btnQrLogin">📷 관리자 QR로 로그인</button>
  </form>
  <canvas id="qrFrame" class="hidden"></canvas>

  <!-- 최초 1회: 관리자 비밀번호 만들기 -->
  <form id="setupForm" class="hidden">
    <input type="password" id="newPw" placeholder="새 관리자 비밀번호 (4자 이상)" autocomplete="new-password">
    <input type="password" id="newPw2" placeholder="비밀번호 확인" autocomplete="new-password">
    <button class="primary" type="submit">설정하고 시작하기</button>
  </form>

  <p class="login-err" id="errText"></p>
  <p class="login-hint" id="hintText"></p>
</div>

<script src="/vendor/jsqr.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const next = new URLSearchParams(location.search).get('next');
  const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;

  function go(role) {
    location.replace(safeNext || (role === 'admin' ? '/admin' : '/'));
  }

  async function post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `요청 실패 (${r.status})`);
    return data;
  }

  async function init() {
    try {
      const s = await (await fetch('/api/auth/state')).json();
      if (s.role) return go(s.role);
      if (!s.setup) {
        $('subText').textContent = '처음 사용합니다 — 관리자 비밀번호를 만들어 주세요';
        $('setupForm').classList.remove('hidden');
        $('hintText').textContent = '이 비밀번호로 관리자 페이지에 들어갈 수 있습니다. 스캐너 PC용 접속 코드는 관리자 › 보안에서 따로 만들 수 있어요.';
        $('newPw').focus();
      } else {
        $('loginForm').classList.remove('hidden');
        $('hintText').textContent = '관리자 비밀번호 또는 스캐너 접속 코드로 로그인합니다. 스캐너 PC는 한 번 로그인하면 계속 유지됩니다.';
        $('pw').focus();
      }
    } catch {
      $('errText').textContent = '서버에 연결할 수 없습니다. 잠시 후 새로고침해 주세요.';
    }
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('errText').textContent = '';
    try {
      const d = await post('/api/auth/login', { password: $('pw').value });
      go(d.role);
    } catch (err) {
      $('errText').textContent = err.message;
      $('pw').select();
    }
  });

  // ── QR 로그인 (BarcodeDetector → jsQR 폴백) ──────────
  let qrStream = null;
  let qrRunning = false;

  async function stopQrCam() {
    qrRunning = false;
    if (qrStream) {
      qrStream.getTracks().forEach((t) => t.stop());
      qrStream = null;
    }
    $('qrCam').classList.add('hidden');
    $('btnQrLogin').textContent = '📷 관리자 QR로 로그인';
  }

  async function decodeFrame(video, detector) {
    const canvas = $('qrFrame');
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return null;
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    if (detector) {
      try {
        const codes = await detector.detect(canvas);
        if (codes.length) return codes[0].rawValue;
      } catch { /* jsQR 로 폴백 */ }
    }
    if (window.jsQR) {
      const img = ctx.getImageData(0, 0, w, h);
      const found = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
      if (found?.data) return found.data;
    }
    return null;
  }

  async function startQrCam() {
    $('errText').textContent = '';
    try {
      qrStream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false,
      });
    } catch {
      $('errText').textContent = '카메라를 열 수 없습니다. 카메라 권한을 확인해 주세요.';
      return;
    }
    const video = $('qrVideo');
    video.srcObject = qrStream;
    await video.play();
    $('qrCam').classList.remove('hidden');
    $('btnQrLogin').textContent = '카메라 닫기';
    $('qrState').textContent = '관리자 로그인 QR 을 비춰 주세요';
    const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
    qrRunning = true;
    let busy = false;
    const loop = async () => {
      if (!qrRunning) return;
      if (!busy) {
        busy = true;
        const value = await decodeFrame(video, detector);
        if (value && qrRunning) {
          if (value.startsWith('ROLLBOOK-LOGIN:')) {
            $('qrState').textContent = '확인 중…';
            try {
              const d = await post('/api/auth/qr-login', { payload: value });
              await stopQrCam();
              return go(d.role);
            } catch (err) {
              $('qrState').textContent = err.message;
            }
          } else if (value.startsWith('ROLLBOOK:')) {
            $('qrState').textContent = '출석용 QR 입니다 — 관리자 로그인 QR 을 비춰 주세요';
          }
        }
        busy = false;
      }
      setTimeout(loop, 180);
    };
    loop();
  }

  $('btnQrLogin').addEventListener('click', () => {
    if (qrRunning) stopQrCam();
    else startQrCam();
  });

  $('setupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('errText').textContent = '';
    if ($('newPw').value !== $('newPw2').value) {
      $('errText').textContent = '두 비밀번호가 서로 다릅니다.';
      return;
    }
    try {
      const d = await post('/api/auth/setup', { password: $('newPw').value });
      go(d.role);
    } catch (err) {
      $('errText').textContent = err.message;
    }
  });

  init();
})();
</script>
</body>
</html>
