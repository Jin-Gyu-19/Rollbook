<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollbook 로그인</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234F46E5%22/><path d=%22M25 25h20v20H25zM55 25h20v20H55zM25 55h20v20H25zM55 55h8v8h-8zM67 55h8v8h-8zM55 67h8v8h-8zM67 67h8v8h-8z%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="/bdo-design.css">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
  .login-card { width: min(400px, calc(100vw - 40px)); padding: 38px 34px 32px; text-align: center; }
  .login-logo { height: 34px; margin-bottom: 14px; }
  .login-title { font-size: 22px; font-weight: 800; margin: 0 0 6px; }
  .login-sub { color: var(--muted); font-size: 14px; margin: 0 0 24px; }
  .login-card input { width: 100%; text-align: center; font-size: 17px; letter-spacing: .06em; margin-bottom: 12px; }
  .login-card button.primary { width: 100%; padding: 12px; font-size: 16px; }
  .login-err { color: var(--danger); font-size: 13.5px; min-height: 20px; margin: 10px 0 0; }
  .login-hint { color: var(--muted); font-size: 12.5px; margin-top: 18px; line-height: 1.6; }
</style>
</head>
<body>

<div class="card login-card">
  <img src="/api/logo" class="login-logo" alt="BDO">
  <h1 class="login-title">Rollbook</h1>
  <p class="login-sub" id="subText">비밀번호를 입력해 주세요</p>

  <!-- 로그인 -->
  <form id="loginForm" class="hidden">
    <input type="password" id="pw" placeholder="비밀번호 또는 스캐너 접속 코드" autocomplete="current-password">
    <button class="primary" type="submit">로그인</button>
  </form>

  <!-- 최초 1회: 관리자 비밀번호 만들기 -->
  <form id="setupForm" class="hidden">
    <input type="password" id="newPw" placeholder="새 관리자 비밀번호 (4자 이상)" autocomplete="new-password">
    <input type="password" id="newPw2" placeholder="비밀번호 확인" autocomplete="new-password">
    <button class="primary" type="submit">설정하고 시작하기</button>
  </form>

  <p class="login-err" id="errText"></p>
  <p class="login-hint" id="hintText"></p>
</div>

<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const next = new URLSearchParams(location.search).get('next');
  const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;

  function go(role) {
    location.replace(safeNext || (role === 'admin' ? '/admin' : '/'));
  }

  async function post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `요청 실패 (${r.status})`);
    return data;
  }

  async function init() {
    try {
      const s = await (await fetch('/api/auth/state')).json();
      if (s.role) return go(s.role);
      if (!s.setup) {
        $('subText').textContent = '처음 사용합니다 — 관리자 비밀번호를 만들어 주세요';
        $('setupForm').classList.remove('hidden');
        $('hintText').textContent = '이 비밀번호로 관리자 페이지에 들어갈 수 있습니다. 스캐너 PC용 접속 코드는 관리자 › 보안에서 따로 만들 수 있어요.';
        $('newPw').focus();
      } else {
        $('loginForm').classList.remove('hidden');
        $('hintText').textContent = '관리자 비밀번호 또는 스캐너 접속 코드로 로그인합니다. 스캐너 PC는 한 번 로그인하면 계속 유지됩니다.';
        $('pw').focus();
      }
    } catch {
      $('errText').textContent = '서버에 연결할 수 없습니다. 잠시 후 새로고침해 주세요.';
    }
  }

  $('loginForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('errText').textContent = '';
    try {
      const d = await post('/api/auth/login', { password: $('pw').value });
      go(d.role);
    } catch (err) {
      $('errText').textContent = err.message;
      $('pw').select();
    }
  });

  $('setupForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('errText').textContent = '';
    if ($('newPw').value !== $('newPw2').value) {
      $('errText').textContent = '두 비밀번호가 서로 다릅니다.';
      return;
    }
    try {
      const d = await post('/api/auth/setup', { password: $('newPw').value });
      go(d.role);
    } catch (err) {
      $('errText').textContent = err.message;
    }
  });

  init();
})();
</script>
</body>
</html>
