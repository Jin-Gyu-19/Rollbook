<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollbook 로그인</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234F46E5%22/><path d=%22M25 25h20v20H25zM55 25h20v20H55zM25 55h20v20H25zM55 55h8v8h-8zM67 55h8v8h-8zM55 67h8v8h-8zM67 67h8v8h-8z%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="/bdo-design.css">
<link rel="stylesheet" href="/app.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 20px; box-sizing: border-box; }
  .login-card { width: min(430px, calc(100vw - 32px)); padding: 34px 30px 28px; text-align: center; }
  .login-logo { height: 32px; margin-bottom: 12px; }
  .login-title { font-size: 21px; font-weight: 800; margin: 0 0 6px; }
  .login-sub { color: var(--muted); font-size: 14px; margin: 0 0 20px; line-height: 1.5; }

  /* 카메라 — 로그인 화면의 주인공 */
  .qr-cam { position: relative; width: 100%; aspect-ratio: 1; border-radius: 20px; overflow: hidden;
            background: #0F172A; display: flex; align-items: center; justify-content: center; }
  .qr-cam video { width: 100%; height: 100%; object-fit: cover; display: block; }
  .qr-cam video.mirror { transform: scaleX(-1); } /* 전면 카메라 거울 모드 */
  .qr-guide { position: absolute; inset: 13%; border-radius: 18px; box-shadow: 0 0 0 999px rgba(15,23,42,.45); pointer-events: none; }
  .qr-guide i { position: absolute; width: 30px; height: 30px; border: 3px solid #fff; border-radius: 4px; }
  .qr-guide .tl { top: -3px; left: -3px; border-right: 0; border-bottom: 0; border-top-left-radius: 14px; }
  .qr-guide .tr { top: -3px; right: -3px; border-left: 0; border-bottom: 0; border-top-right-radius: 14px; }
  .qr-guide .bl { bottom: -3px; left: -3px; border-right: 0; border-top: 0; border-bottom-left-radius: 14px; }
  .qr-guide .br { bottom: -3px; right: -3px; border-left: 0; border-top: 0; border-bottom-right-radius: 14px; }
  .qr-cam-off { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center;
                gap: 12px; color: #E2E8F0; font-size: 14px; padding: 24px; text-align: center; line-height: 1.6; }
  .qr-cam-off .icon { font-size: 34px; }
  .qr-state { margin: 14px 0 0; font-size: 14.5px; font-weight: 600; min-height: 22px; }
  .qr-state.err { color: var(--danger); }
  .qr-state.ok { color: #16A34A; }

  .login-hint { color: var(--muted); font-size: 12.5px; margin-top: 16px; line-height: 1.65; }
  .login-link { display: inline-block; margin-top: 14px; color: var(--muted); font-size: 12.5px;
                text-decoration: underline; cursor: pointer; background: none; border: 0; padding: 4px; }
  .login-card input { width: 100%; text-align: center; font-size: 15px; margin-bottom: 10px; }
  .login-card button.primary { width: 100%; padding: 12px; font-size: 15.5px; }
  .login-err { color: var(--danger); font-size: 13.5px; min-height: 20px; margin: 8px 0 0; }

  /* 발급된 QR·복구 코드 보여주기 */
  .issued-qr { display: flex; justify-content: center; margin: 4px 0 14px; }
  .issued-qr canvas, .issued-qr img { width: 210px; height: 210px; border: 1px solid var(--line); border-radius: 14px; }
  .code-box { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 15px; font-weight: 700;
              letter-spacing: .05em; background: var(--bg); border: 1px solid var(--line);
              border-radius: 12px; padding: 12px 10px; word-break: break-all; margin: 8px 0 4px; }
  .warn-box { background: #FEF3C7; border: 1px solid #FDE68A; color: #92400E; border-radius: 12px;
              padding: 12px 14px; font-size: 13px; line-height: 1.6; text-align: left; margin-top: 12px; }
</style>
</head>
<body>

<div class="card login-card">
  <img src="/api/logo" class="login-logo" alt="BDO">
  <h1 class="login-title">Rollbook</h1>
  <p class="login-sub" id="subText">로그인 QR 을 카메라에 비춰 주세요</p>

  <!-- QR 스캔 로그인 (기본) -->
  <div id="scanView">
    <div class="qr-cam" id="qrCam">
      <video id="qrVideo" autoplay muted playsinline></video>
      <div class="qr-guide" id="qrGuide"><i class="tl"></i><i class="tr"></i><i class="bl"></i><i class="br"></i></div>
      <div class="qr-cam-off" id="camOff">
        <span class="icon">📷</span>
        <span id="camOffMsg">카메라를 시작하는 중입니다…</span>
        <button class="primary" id="btnRetryCam" style="display:none; width:auto; padding:8px 18px;">카메라 다시 시작</button>
      </div>
    </div>
    <p class="qr-state" id="qrState"></p>
    <p class="login-hint" id="hintText">관리자 QR 로 로그인하면 관리 화면으로, 스캐너 PC QR 로 로그인하면 출석 촬영 화면으로 들어갑니다.</p>
    <button class="login-link hidden" id="btnPasswordLogin">비밀번호로 로그인</button>
    <button class="login-link" id="btnRecovery">QR 을 잃어버렸을 때</button>
    <button class="login-link hidden" id="btnIssueNew">가진 QR 이 없어요 — 새로 발급받기</button>
  </div>

  <!-- 비밀번호 로그인 -->
  <div id="passwordView" class="hidden">
    <form id="passwordForm">
      <input type="password" id="loginPw" placeholder="관리자 비밀번호" autocomplete="current-password">
      <button class="primary" type="submit">로그인</button>
    </form>
    <p class="login-err" id="passwordErr"></p>
    <p class="login-hint">관리자 비밀번호로 로그인합니다. 스캐너 PC 는 QR 로만 로그인할 수 있습니다.</p>
    <button class="login-link" id="btnBackToScan2">QR 스캔으로 돌아가기</button>
  </div>

  <!-- 비상 복구 코드 -->
  <div id="recoveryView" class="hidden">
    <form id="recoveryForm">
      <input type="password" id="recoveryCode" placeholder="비상 복구 코드" autocomplete="one-time-code">
      <button class="primary" type="submit">복구 코드로 로그인</button>
    </form>
    <p class="login-err" id="recoveryErr"></p>
    <p class="login-hint">초기 설정 때 저장해 둔 복구 코드입니다. 로그인 후 보안 탭에서 QR 을 다시 내려받으세요.</p>
    <button class="login-link" id="btnBackToScan">QR 스캔으로 돌아가기</button>
  </div>

  <!-- 최초 1회: 발급 결과 (가진 QR 등록 or 새 QR 발급) -->
  <div id="setupView" class="hidden">
    <div id="setupResult">
      <div class="issued-qr hidden" id="setupQrHolder"></div>
      <div id="setupDownloads">
        <button class="primary" id="btnDownloadQr" style="margin-bottom:8px;">QR 이미지 내려받기</button>
        <button id="btnDownloadQrPdf" style="width:100%; padding:10px; margin-bottom:10px;">인쇄용 PDF 내려받기 (30·40·50mm)</button>
      </div>
      <p class="login-hint" id="setupLead" style="margin-top:0;"></p>
      <div class="code-box" id="setupRecoveryCode"></div>
      <div class="warn-box" id="setupWarn">
        이 복구 코드는 <b>지금만 볼 수 있습니다.</b> 따로 적어 두세요 —
        QR 을 잃어버렸을 때 이 코드로만 다시 들어올 수 있습니다.
      </div>
      <button class="primary" id="btnSetupDone" style="width:100%; padding:12px; margin-top:14px;">저장했습니다 — 시작하기</button>
    </div>
  </div>
</div>

<canvas id="qrFrame" class="hidden"></canvas>

<script src="/vendor/jsqr.js"></script>
<script src="/vendor/qr-code-styling.js"></script>
<script src="/vendor/jspdf.min.js"></script>
<script>
(() => {
  const $ = (id) => document.getElementById(id);
  const next = new URLSearchParams(location.search).get('next');
  const safeNext = next && next.startsWith('/') && !next.startsWith('//') ? next : null;

  function go(role) {
    location.replace(safeNext || (role === 'admin' ? '/admin' : '/'));
  }

  async function post(path, body) {
    const r = await fetch(path, {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(body),
    });
    const data = await r.json().catch(() => ({}));
    if (!r.ok) {
      const e = new Error(data.error || `요청 실패 (${r.status})`);
      e.locked = Boolean(data.locked);
      throw e;
    }
    return data;
  }

  function setState(msg, kind = '') {
    $('qrState').textContent = msg;
    $('qrState').className = `qr-state ${kind}`;
  }

  // ── 카메라 QR 스캔 ───────────────────────────────────
  let stream = null;
  let scanning = false;
  let locked = false;

  async function decodeFrame(video, detector) {
    const w = video.videoWidth;
    const h = video.videoHeight;
    if (!w || !h) return null;
    const canvas = $('qrFrame');
    canvas.width = w;
    canvas.height = h;
    const ctx = canvas.getContext('2d', { willReadFrequently: true });
    ctx.drawImage(video, 0, 0, w, h);
    if (detector) {
      try {
        const codes = await detector.detect(canvas);
        if (codes.length) return codes[0].rawValue;
      } catch { /* jsQR 로 폴백 */ }
    }
    if (window.jsQR) {
      const img = ctx.getImageData(0, 0, w, h);
      const found = jsQR(img.data, w, h, { inversionAttempts: 'dontInvert' });
      if (found?.data) return found.data;
    }
    return null;
  }

  function stopCamera() {
    scanning = false;
    if (stream) {
      stream.getTracks().forEach((t) => t.stop());
      stream = null;
    }
  }

  async function startCamera() {
    $('camOff').style.display = 'flex';
    $('btnRetryCam').style.display = 'none';
    $('camOffMsg').textContent = '카메라를 시작하는 중입니다…';
    try {
      stream = await navigator.mediaDevices.getUserMedia({
        video: { facingMode: 'environment', width: { ideal: 1920 }, height: { ideal: 1080 } },
        audio: false,
      });
    } catch {
      $('camOffMsg').textContent = '카메라를 열 수 없습니다. 브라우저의 카메라 권한을 허용해 주세요.';
      $('btnRetryCam').style.display = '';
      setState('카메라가 있어야 로그인할 수 있습니다', 'err');
      return;
    }
    const video = $('qrVideo');
    video.srcObject = stream;
    await video.play();
    // 전면 카메라면 미리보기만 거울 모드로 (인식은 원본 영상을 쓰므로 영향 없음)
    const camSettings = stream.getVideoTracks()[0]?.getSettings?.() || {};
    video.classList.toggle('mirror', camSettings.facingMode !== 'environment');
    $('camOff').style.display = 'none';
    setState(setupMode ? '등록할 관리자 QR 을 사각형 안에 맞춰 주세요' : '로그인 QR 을 사각형 안에 맞춰 주세요');
    scanLoop(video);
  }

  async function scanLoop(video) {
    const detector = 'BarcodeDetector' in window ? new BarcodeDetector({ formats: ['qr_code'] }) : null;
    scanning = true;
    let lastMiss = '';
    while (scanning) {
      const value = await decodeFrame(video, detector);
      if (!scanning) break;
      if (value) {
        // 초기 설정 중이면 비춘 관리자 QR 을 이 시스템에 등록한다
        if (setupMode && value.startsWith('ROLLBOOK-LOGIN:')) {
          setState('등록하는 중…');
          try {
            const d = await post('/api/auth/claim', { payload: value });
            stopCamera();
            showClaimed(d);
            return;
          } catch (e) {
            setState(e.message, 'err');
            await sleep(1800);
          }
        } else if (value.startsWith('ROLLBOOK-LOGIN:') || value.startsWith('ROLLBOOK-SCANNER:')) {
          setState('확인 중…');
          try {
            const d = await post('/api/auth/qr-login', { payload: value });
            setState(d.name ? `${d.name}님, 로그인되었습니다` : '로그인되었습니다', 'ok');
            stopCamera();
            return go(d.role);
          } catch (e) {
            setState(e.message, 'err');
            if (e.locked) {
              locked = true;
              stopCamera();
              $('camOff').style.display = 'flex';
              $('camOffMsg').textContent = e.message;
              return;
            }
            await sleep(1500);
          }
        } else if (value !== lastMiss) {
          lastMiss = value;
          setState(value.startsWith('ROLLBOOK:') ? '출석용 QR 입니다 — 로그인 QR 을 비춰 주세요' : '로그인 QR 이 아닙니다', 'err');
        }
      }
      await sleep(150);
    }
  }

  const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

  $('btnRetryCam').addEventListener('click', () => { if (!locked) startCamera(); });

  // ── 화면 전환 ────────────────────────────────────────
  function show(view) {
    for (const v of ['scanView', 'passwordView', 'recoveryView', 'setupView']) $(v).classList.toggle('hidden', v !== view);
  }

  $('btnPasswordLogin').addEventListener('click', () => {
    stopCamera();
    show('passwordView');
    $('subText').textContent = '관리자 비밀번호로 로그인합니다';
    $('loginPw').focus();
  });

  $('btnBackToScan2').addEventListener('click', () => {
    show('scanView');
    $('subText').textContent = '로그인 QR 을 카메라에 비춰 주세요';
    if (!locked) startCamera();
  });

  $('passwordForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('passwordErr').textContent = '';
    try {
      const d = await post('/api/auth/password-login', { password: $('loginPw').value });
      go(d.role);
    } catch (err) {
      $('passwordErr').textContent = err.message;
      $('loginPw').select();
    }
  });

  $('btnRecovery').addEventListener('click', () => {
    stopCamera();
    show('recoveryView');
    $('subText').textContent = '비상 복구 코드로 로그인합니다';
    $('recoveryCode').focus();
  });

  $('btnBackToScan').addEventListener('click', () => {
    show('scanView');
    $('subText').textContent = '로그인 QR 을 카메라에 비춰 주세요';
    if (!locked) startCamera();
  });

  $('recoveryForm').addEventListener('submit', async (e) => {
    e.preventDefault();
    $('recoveryErr').textContent = '';
    try {
      const d = await post('/api/auth/recovery', { code: $('recoveryCode').value.trim() });
      go(d.role);
    } catch (err) {
      $('recoveryErr').textContent = err.message;
      $('recoveryCode').select();
    }
  });

  // ── 최초 설정 ────────────────────────────────────────
  let setupMode = false; // true 면 스캔한 QR 을 이 시스템에 등록한다
  let setupRole = null;
  let qrBlobUrl = null;
  let qrCanvas = null;
  let qrOwner = '';

  // 인쇄용 PDF — 같은 QR 을 30·40·50mm 세 크기로
  function savePdf(canvas, who, filename) {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF({ unit: 'mm', format: 'a4' });
    const dataUrl = canvas.toDataURL('image/png');

    // 한글은 PDF 기본 글꼴로 안 나오므로 캔버스에 그려서 이미지로 넣는다
    const drawText = (lines, xMm, yMm, widthMm) => {
      const c = document.createElement('canvas');
      let h = 6;
      for (const l of lines) h += Math.round(l.size * 1.45);
      c.width = 1600;
      c.height = h + 6;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#fff';
      ctx.fillRect(0, 0, c.width, c.height);
      ctx.textBaseline = 'top';
      let y = 6;
      for (const l of lines) {
        ctx.font = `${l.bold ? '700 ' : ''}${l.size}px 'Pretendard','Apple SD Gothic Neo','Malgun Gothic',system-ui,sans-serif`;
        ctx.fillStyle = l.color || '#111827';
        ctx.fillText(l.text, 0, y);
        y += Math.round(l.size * 1.45);
      }
      doc.addImage(c.toDataURL('image/png'), 'PNG', xMm, yMm, widthMm, (c.height / c.width) * widthMm, undefined, 'FAST');
    };

    drawText([
      { text: 'Rollbook 관리자 로그인 QR', size: 54, bold: true },
      { text: `${who} · 한 장을 잘라서 로그인 화면 카메라에 비춰 주세요`, size: 34, color: '#6B7280' },
    ], 20, 16, 170);

    let y = 42;
    for (const mm of [30, 40, 50]) {
      doc.addImage(dataUrl, 'PNG', 20, y, mm, mm, 'loginqr', 'FAST');
      doc.setDrawColor(200);
      doc.rect(20, y, mm, mm);
      doc.setFontSize(11);
      doc.setTextColor(17);
      doc.text(`${mm} mm`, 20 + mm + 8, y + mm / 2);
      y += mm + 14;
    }

    drawText([
      { text: '인쇄할 때 "용지에 맞춤"을 끄고 100% 배율로 출력하세요.', size: 30, color: '#9CA3AF' },
      { text: 'QR 둘레의 흰 여백은 잘라내지 말고 남겨 두어야 인식이 잘 됩니다.', size: 30, color: '#9CA3AF' },
    ], 20, y + 2, 170);
    doc.save(filename.replace(/[\\/:*?"<>|]/g, '_'));
  }

  // 가지고 있던 QR 을 등록한 경우 — QR 은 이미 손에 있으니 복구 코드만 보여 준다
  function showClaimed(d) {
    setupMode = false;
    setupRole = d.role;
    qrOwner = d.name || '관리자';
    $('setupDownloads').classList.add('hidden');
    $('setupLead').textContent = `${qrOwner}님의 QR 이 이 시스템에 등록되었습니다. 앞으로 그 QR 로 로그인하세요.`;
    $('setupRecoveryCode').textContent = d.recovery_code;
    show('setupView');
    $('subText').textContent = 'QR 등록 완료 — 복구 코드를 적어 두세요';
  }

  // 가진 QR 이 없을 때 — 새 QR 과 복구 코드를 발급받는다
  async function issueNew() {
    setState('발급하는 중…');
    try {
      const d = await post('/api/auth/setup', {});
      setupMode = false;
      stopCamera();
      setupRole = d.role;
      qrOwner = d.name || '관리자';
      $('setupRecoveryCode').textContent = d.recovery_code;
      const qr = new QRCodeStyling({
        width: 640, height: 640, type: 'canvas',
        data: `ROLLBOOK-LOGIN:${d.login_token}`,
        margin: 12,
        qrOptions: { errorCorrectionLevel: 'H' },
        dotsOptions: { type: 'square', color: '#111827' },
        backgroundOptions: { color: '#FFFFFF' },
        image: '/api/logo',
        imageOptions: { crossOrigin: 'anonymous', margin: 6, imageSize: 0.35, hideBackgroundDots: true },
      });
      qr.append($('setupQrHolder'));
      qrBlobUrl = await qr.getRawData('png').then((b) => URL.createObjectURL(b));
      await sleep(400); // 로고가 얹힐 때까지
      qrCanvas = $('setupQrHolder').querySelector('canvas');
      $('setupQrHolder').classList.remove('hidden');
      $('btnDownloadQr').dataset.name = `관리자로그인_${qrOwner}.png`;
      $('setupLead').textContent = `${qrOwner}님의 로그인 QR 이 발급되었습니다. 내려받아 보관하세요.`;
      show('setupView');
      $('subText').textContent = '발급된 QR 과 복구 코드를 보관해 주세요';
    } catch (err) {
      setState(err.message, 'err');
    }
  }

  $('btnIssueNew').addEventListener('click', () => {
    if (confirm('가지고 있는 QR 없이 새로 발급받을까요?\n이미 받아 둔 QR 이 있다면 그것을 카메라에 비추는 편이 좋습니다.')) issueNew();
  });

  $('btnDownloadQr').addEventListener('click', () => {
    if (!qrBlobUrl) return;
    const a = document.createElement('a');
    a.href = qrBlobUrl;
    a.download = $('btnDownloadQr').dataset.name || '관리자로그인.png';
    a.click();
  });

  $('btnDownloadQrPdf').addEventListener('click', () => {
    if (qrCanvas) savePdf(qrCanvas, qrOwner, `관리자로그인_${qrOwner}_인쇄용.pdf`);
  });

  $('btnSetupDone').addEventListener('click', () => go(setupRole || 'admin'));

  // ── 시작 ─────────────────────────────────────────────
  async function init() {
    try {
      const s = await (await fetch('/api/auth/state')).json();
      // 이미 로그인돼 있으면 원래 화면으로. 단 ?switch=1 이면 로그아웃하고 다시 스캔
      if (s.role) {
        if (!new URLSearchParams(location.search).has('switch')) return go(s.role);
        await post('/api/auth/logout', {});
      }
      if (s.lockedMinutes) {
        locked = true;
        show('scanView');
        $('camOff').style.display = 'flex';
        $('camOffMsg').textContent = `로그인이 잠겼습니다. ${s.lockedMinutes}분 뒤에 다시 시도해 주세요.`;
        setState('5회 이상 실패해서 잠금 상태입니다', 'err');
        return;
      }
      show('scanView');
      if (s.hasPassword) $('btnPasswordLogin').classList.remove('hidden');
      if (!s.setup) {
        // 아직 아무도 등록하지 않은 시스템 — 가진 QR 을 비추면 그 QR 로 등록된다
        setupMode = true;
        $('subText').textContent = '처음 사용합니다 — 받아 두신 관리자 QR 을 비춰 주세요';
        $('hintText').textContent = '비추신 QR 이 이 시스템의 관리자 QR 로 등록됩니다. 여러 PC 를 쓸 때도 같은 QR 을 쓰면 됩니다.';
        $('btnRecovery').classList.add('hidden');
        $('btnIssueNew').classList.remove('hidden');
      }
      startCamera();
    } catch {
      setState('서버에 연결할 수 없습니다. 잠시 후 새로고침해 주세요.', 'err');
    }
  }

  init();
})();
</script>
</body>
</html>
