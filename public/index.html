<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Rollbook — QR 출석 체크</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234F46E5%22/><path d=%22M25 25h20v20H25zM55 25h20v20H55zM25 55h20v20H25zM55 55h8v8h-8zM67 55h8v8h-8zM55 67h8v8h-8zM67 67h8v8h-8z%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="/bdo-design.css">
<link rel="stylesheet" href="/app.css">
</head>
<body>

<header class="topbar">
  <a class="brand" href="/"><b>BDO</b> Rollbook</a>
  <nav class="nav">
    <a href="/" class="active">출석 체크</a>
    <a href="/admin">관리자</a>
  </nav>
</header>

<main class="container scan-wrap screen-enter">
  <div class="card scan-card">
    <h1>QR 출석 체크</h1>
    <p class="muted">개인 QR 코드를 카메라에 비추면 자동으로 출석 처리됩니다.</p>

    <div class="scan-stage">
      <video id="video" autoplay muted playsinline></video>
      <div class="scan-frame"><div class="box"></div></div>
      <div class="scan-offline hidden" id="cameraOffline">
        <span class="icon">📷</span>
        <span id="cameraOfflineMsg">카메라를 시작하는 중입니다…</span>
        <button class="primary" id="btnRetryCamera">카메라 다시 시작</button>
      </div>
    </div>

    <div class="scan-meta">
      <span class="stag" id="camState">카메라 준비 중</span>
      <span class="stag who hidden" id="sheetState"></span>
    </div>
    <p class="hint" id="sheetHint"></p>
  </div>
</main>

<!-- 출석 결과 모달 -->
<div class="result-modal" id="resultModal" aria-live="assertive">
  <div class="result-body">
    <div class="result-icon ok" id="resultIcon">✓</div>
    <div class="result-name" id="resultName"></div>
    <div class="result-msg" id="resultMsg"></div>
  </div>
</div>

<canvas id="frame" class="hidden"></canvas>

<script src="/vendor/jsqr.js"></script>
<script src="/scanner.js"></script>
</body>
</html>
