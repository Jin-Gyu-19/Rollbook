<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rollbook — QR 출석 체크</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2224%22 fill=%22%234F46E5%22/><path d=%22M25 25h20v20H25zM55 25h20v20H55zM25 55h20v20H25zM55 55h8v8h-8zM67 55h8v8h-8zM55 67h8v8h-8zM67 67h8v8h-8z%22 fill=%22white%22/></svg>">
<link rel="stylesheet" href="/bdo-design.css">
<link rel="stylesheet" href="/app.css">
</head>
<body class="scan-full">

<!-- 전체화면 카메라 -->
<div class="scan-stage">
  <video id="video" autoplay muted playsinline></video>
  <!-- 같은 카메라 영상을 한 번 더 — 테두리 안쪽만 오려서 또렷하게 보여 준다 -->
  <video id="videoClear" autoplay muted playsinline></video>
  <div class="scan-frame">
    <div class="box">
      <i class="c tl"></i><i class="c tr"></i><i class="c bl"></i><i class="c br"></i>
      <i class="slot"></i>
      <div class="scan-title">QR 출석 체크</div>
    </div>
  </div>
  <div class="scan-offline hidden" id="cameraOffline">
    <div class="scan-title">QR 출석 체크</div>
    <span class="icon">📷</span>
    <span id="cameraOfflineMsg">카메라를 시작하는 중입니다…</span>
    <button class="primary" id="btnRetryCamera">카메라 다시 시작</button>
  </div>
</div>

<!-- 떠 있는 상단: 로고 · 관리자(좁은 화면용) -->
<header class="scan-top">
  <a class="scan-chip" href="/"><img src="/api/logo" class="brand-logo" alt="BDO"> Rollbook</a>
  <a class="scan-chip scan-link glass" href="/admin">관리자</a>
</header>

<!-- 우측: 실시간 출석부 패널 (기록 중 출석부 정보 포함) -->
<aside class="scan-panel glass" id="attPanel">
  <div class="scan-panel-head">
    <div class="scan-panel-headTop">
      <div class="scan-panel-title" id="panelSheetTitle">출석부</div>
      <span class="scan-panel-tools">
        <a class="panel-admin" href="/admin">관리자</a>
        <button class="panel-admin" id="btnLogout" type="button">로그아웃</button>
      </span>
    </div>
    <div class="scan-panel-headBot">
      <div class="scan-panel-sub" id="panelSheetSub"></div>
      <span class="scan-panel-count" id="panelCount"></span>
    </div>
  </div>
  <div class="scan-panel-list" id="panelList"></div>
</aside>

<!-- 하단: 상태 알약 -->
<div class="scan-bottom">
  <div class="scan-pill" id="scanPill"><span class="dot"></span><span id="camState">카메라 준비 중…</span><span class="cam-res" id="camRes"></span></div>
</div>

<!-- 출석 결과 모달 (흰 유리 + 체크 링) -->
<div class="result-modal" id="resultModal" aria-live="assertive">
  <div class="result-body">
    <div class="result-ring" id="resultRing">✓</div>
    <div class="result-name" id="resultName"></div>
    <div class="result-div"></div>
    <div class="result-msg" id="resultMsg"></div>
  </div>
</div>

<canvas id="frame" class="hidden"></canvas>

<script src="/vendor/zxing-reader.js"></script>
<script src="/vendor/jsqr.js"></script>
<script src="/scanner.js"></script>
</body>
</html>
